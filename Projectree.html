<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projectree - SnapNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: rgba(224, 170, 94, 0.35); color: #fff; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d0c0b;
      background-image: 
        radial-gradient(at 20% 15%, rgba(185, 95, 28, 0.52) 0px, transparent 65%),
        radial-gradient(at 80% 85%, rgba(95, 48, 20, 0.32) 0px, transparent 70%),
        radial-gradient(at 50% 40%, rgba(35, 24, 18, 0.9) 0px, #0b0a09 100%);
      background-attachment: fixed;
      color: #e5e0d8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      line-height: 1.6;
      padding-top: 40px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.025;
      z-index: 999;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"><filter id="fineNoise"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23fineNoise)"/></svg>');
    }

    #project-wrapper {
      width: 100%;
      max-width: 1160px;
      display: flex;
      flex-direction: column;
      z-index: 1;
      position: relative;
      animation: fadeIn 0.35s ease forwards;
      padding-bottom: 60px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sleeping-otter-container {
      position: absolute;
      top: -24px;
      left: 12px;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
      z-index: 12;
    }

    .otter-svg {
      width: 58px;
      height: 28px;
      animation: otterBreathe 3.5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes otterBreathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(0.92) translateY(1px); }
    }

    .otter-zzz {
      position: absolute;
      top: -8px;
      right: 12px;
      font-size: 10px;
      font-weight: 600;
      color: rgba(224, 170, 94, 0.75);
      animation: zzzFloat 3.5s infinite;
      user-select: none;
    }

    @keyframes zzzFloat {
      0% { opacity: 0; transform: translate(0, 4px) scale(0.8); }
      40% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(8px, -14px) scale(1.2); }
    }

    .project-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 42px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: none;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #f7f3ec;
      backdrop-filter: blur(8px);
      user-select: none;
    }

    #project-dashboard {
      display: flex;
      flex-direction: column;
      padding: 32px 40px;
      min-height: 75vh;
      background: rgba(24, 21, 19, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 20px 20px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      position: relative;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-title-area {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dashboard-title {
      font-family: Georgia, serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #f7f3ec;
    }

    .dashboard-subtitle {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .btn {
      padding: 8px 16px;
      font: 600 0.82rem 'Plus Jakarta Sans', sans-serif;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #e5e0d8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(224, 170, 94, 0.4); }

    .explorer-box {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(18, 15, 13, 0.6);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .explorer-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .explorer-path {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ded8ce;
      font-weight: 500;
    }

    .folder-group {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .folder-group:last-child { border-bottom: none; }

    .folder-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 0.88rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .folder-row:hover { background: rgba(255, 255, 255, 0.05); }

    .folder-title-col {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: #f7f3ec;
    }

    .folder-icon {
      color: #e0aa5e;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .folder-row.open .folder-icon {
      transform: rotate(90deg);
    }

    .note-count-tag {
      font-size: 0.75rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .notes-tree-list {
      display: none;
      background: rgba(0, 0, 0, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
    .notes-tree-list.expanded { display: block; }

    .note-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.85rem;
      transition: background 0.15s ease;
    }
    .note-row:last-child { border-bottom: none; }
    .note-row:hover { background: rgba(255, 255, 255, 0.04); }

    .note-name-col {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex: 1;
    }
    .note-name-col:hover .note-title-text {
      color: #e0aa5e;
      text-decoration: underline;
    }

    .note-icon {
      color: rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    .note-title-text {
      color: #ded8ce;
    }

    .action-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      font-size: 0.8rem;
      transition: color 0.15s ease;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .action-btn:hover { color: #e57373; background: rgba(255, 255, 255, 0.05); }

    .empty-state-msg {
      padding: 36px;
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      font-style: italic;
    }

    .focused-item {
      background: rgba(224, 170, 94, 0.15) !important;
      outline: 1px solid rgba(224, 170, 94, 0.4);
      border-radius: 6px;
    }

    #shortcut-popup {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(36, 30, 27, 0.92);
      border: 1px solid rgba(224, 170, 94, 0.25);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.82rem;
      color: #ded8ce;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      z-index: 50;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #shortcut-popup.show {
      opacity: 1;
      transform: translateY(0);
    }
    .kbd-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 3px 7px;
      font-family: monospace;
      font-size: 0.78rem;
      color: #e0aa5e;
    }

    /* ==== CUSTOM MODALS (Prompt & Confirm) ==== */
    .custom-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .custom-modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .custom-modal-box {
      background: rgba(24, 21, 19, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
      width: 90%; max-width: 420px; padding: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7);
      display: flex; flex-direction: column; gap: 16px;
      transform: translateY(20px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .custom-modal-overlay.active .custom-modal-box { transform: translateY(0) scale(1); }
    
    .custom-modal-box h2 { font-family: Georgia, serif; font-size: 1.4rem; color: #f7f3ec; margin-bottom: 4px; }
    .custom-modal-box p { font-size: 0.9rem; color: rgba(255, 255, 255, 0.5); line-height: 1.5; margin-bottom: 8px; }
    
    .custom-modal-box input {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px; padding: 12px 14px; color: #f7f3ec;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; outline: none; width: 100%;
    }
    .custom-modal-box input:focus { border-color: rgba(224, 170, 94, 0.4); }
    
    .custom-modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
    
    .btn-cancel {
      padding: 10px 16px; font: 600 0.9rem 'Plus Jakarta Sans', sans-serif;
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
      background: transparent; color: rgba(255, 255, 255, 0.6); cursor: pointer; transition: all 0.2s ease;
    }
    .btn-cancel:hover { background: rgba(255, 255, 255, 0.05); color: #f7f3ec; }
    
    .btn-confirm-action {
      padding: 10px 16px; font: 600 0.9rem 'Plus Jakarta Sans', sans-serif;
      border: 1px solid rgba(224, 170, 94, 0.3); border-radius: 8px;
      background: rgba(224, 170, 94, 0.15); color: #f7f3ec; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-confirm-action:hover { background: rgba(224, 170, 94, 0.25); }
    
    .btn-danger {
      background: rgba(229, 115, 115, 0.15); border: 1px solid rgba(229, 115, 115, 0.3); color: #e57373;
    }
    .btn-danger:hover { background: rgba(229, 115, 115, 0.25); }
  </style>
</head>
<body>

  <div id="project-wrapper">
    <div class="sleeping-otter-container" title="Shh... sleeping otter!">
      <span class="otter-zzz">Zzz</span>
      <svg class="otter-svg" viewBox="0 0 70 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 6 25 Q 12 18 22 22 Q 12 28 6 25 Z" fill="#6a4427"/>
        <ellipse cx="32" cy="20" rx="18" ry="8" fill="#7d5231"/>
        <ellipse cx="34" cy="21" rx="12" ry="5.5" fill="#cbb396"/>
        <ellipse cx="50" cy="17" rx="8" ry="6.5" fill="#7d5231"/>
        <ellipse cx="54" cy="18.5" rx="4" ry="3" fill="#dfcfbd"/>
        <path d="M 56 17.5 Q 57.5 17.5 57 18.5 Q 56.5 19.5 55.5 18.5 Z" fill="#20130a"/>
        <path d="M 49 16 Q 51 18 53 16" stroke="#20130a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <circle cx="45" cy="12" r="1.8" fill="#5c381f"/>
        <path d="M 54 19 L 60 18 M 54 19.5 L 59 20.5" stroke="#dfcfbd" stroke-width="0.8" opacity="0.7"/>
        <ellipse cx="44" cy="24" rx="3" ry="2" fill="#5c381f"/>
        <ellipse cx="22" cy="24" rx="3" ry="2" fill="#5c381f"/>
      </svg>
    </div>

    <div class="project-header-bar">
      <span>Projectree Explorer</span>
    </div>

    <div id="project-dashboard">
      <div class="dashboard-header">
        <div class="header-title-area">
          <h1 class="dashboard-title">Notebooks & Folders</h1>
          <p class="dashboard-subtitle">Organize your thought structure and manage notes.</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn" id="new-folder-btn" style="outline: none;">+ New Folder</button>
        </div>
      </div>

      <div class="explorer-box">
        <div class="explorer-header">
          <div class="explorer-path">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M.5 3l.04 1.5H14v-1A1.5 1.5 0 0 0 12.5 2H7l-1.5-1.5H2A1.5 1.5 0 0 0 .5 2z"/>
              <path d="M15.5 5H.5l1 9A1.5 1.5 0 0 0 3 15h10a1.5 1.5 0 0 0 1.5-1z"/>
            </svg>
            <span>Projects</span>
          </div>
          <span id="total-folders-badge">0 Folders</span>
        </div>

        <div id="folders-container"></div>
      </div>

      <div id="shortcut-popup">
        <span>💡 <span class="kbd-badge">Alt</span>+<span class="kbd-badge">W</span> to Editor | Use <span class="kbd-badge">⬆</span> <span class="kbd-badge">⬇</span> <span class="kbd-badge">⬅</span> <span class="kbd-badge">➡</span> to navigate</span>
      </div>
    </div>
  </div>

  <!-- CUSTOM PROMPT MODAL -->
  <div class="custom-modal-overlay" id="custom-prompt-overlay">
    <div class="custom-modal-box">
      <h2 id="custom-prompt-title">Enter details</h2>
      <input type="text" id="custom-prompt-input" autocomplete="off" />
      <div class="custom-modal-actions">
        <button class="btn-cancel" onclick="closeCustomPrompt(null)">Cancel</button>
        <button class="btn-confirm-action" onclick="submitCustomPrompt()">Create</button>
      </div>
    </div>
  </div>

  <!-- CUSTOM CONFIRM MODAL (For deletions) -->
  <div class="custom-modal-overlay" id="custom-confirm-overlay">
    <div class="custom-modal-box">
      <h2 id="custom-confirm-title">Confirm Action</h2>
      <p id="custom-confirm-message">Are you sure?</p>
      <div class="custom-modal-actions">
        <button class="btn-cancel" onclick="closeCustomConfirm(false)">Cancel</button>
        <button class="btn-confirm-action btn-danger" onclick="closeCustomConfirm(true)">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CUSTOM MODALS LOGIC
    // ==========================================
    let promptResolver = null;
    let confirmResolver = null;

    function openCustomPrompt(title, placeholder) {
      return new Promise((resolve) => {
        promptResolver = resolve;
        document.getElementById('custom-prompt-title').textContent = title;
        const input = document.getElementById('custom-prompt-input');
        input.placeholder = placeholder;
        input.value = '';
        document.getElementById('custom-prompt-overlay').classList.add('active');
        input.focus();
      });
    }

    function closeCustomPrompt(value) {
      document.getElementById('custom-prompt-overlay').classList.remove('active');
      
      document.getElementById('custom-prompt-input').blur();
      document.body.focus();
      
      if (promptResolver) {
        promptResolver(value);
        promptResolver = null;
      }
    }

    function submitCustomPrompt() {
      const input = document.getElementById('custom-prompt-input');
      closeCustomPrompt(input.value);
    }

    document.getElementById('custom-prompt-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitCustomPrompt();
      if (e.key === 'Escape') closeCustomPrompt(null);
    });

    function openCustomConfirm(title, message) {
      return new Promise((resolve) => {
        confirmResolver = resolve;
        document.getElementById('custom-confirm-title').textContent = title;
        document.getElementById('custom-confirm-message').textContent = message;
        document.getElementById('custom-confirm-overlay').classList.add('active');
      });
    }

    function closeCustomConfirm(result) {
      document.getElementById('custom-confirm-overlay').classList.remove('active');
      
      document.body.focus();
      
      if (confirmResolver) {
        confirmResolver(result);
        confirmResolver = null;
      }
    }

    // ==========================================
    // PROJECT LOGIC
    // ==========================================
    function initProjects(projs) {
        if (!projs) return [];
        projs.forEach(p => {
            if (!p.folders) p.folders = [];
            if (!p.files) p.files = [];
            initProjects(p.folders);
        });
        return projs;
    }

    let projects = initProjects(JSON.parse(localStorage.getItem('snapnote_projects')) || []);
    const foldersContainer = document.getElementById('folders-container');
    const totalFoldersBadge = document.getElementById('total-folders-badge');
    const shortcutPopup = document.getElementById('shortcut-popup');
    
    let navItems = [];
    let focusedIndex = 0;
    let focusedActionIndex = 0;
    let openFolderPaths = new Set();

    function showPopupNotification() {
      shortcutPopup.classList.add('show');
      setTimeout(() => { shortcutPopup.classList.remove('show'); }, 4500);
    }
    window.addEventListener('DOMContentLoaded', showPopupNotification);

    function saveProjects() {
      localStorage.setItem('snapnote_projects', JSON.stringify(projects));
    }

    function generateFolderHTML(folder, pathArr, level = 0) {
      const pathStr = pathArr.join('-');
      const groupMargin = level > 0 ? 'margin-left: 20px; border-left: 1px solid rgba(255,255,255,0.08); border-bottom: none;' : '';
      const childMargin = level >= 0 ? 'margin-left: 20px; border-left: 1px solid rgba(255,255,255,0.08);' : '';

      const isOpen = openFolderPaths.has(pathStr);
      const rowClass = isOpen ? 'folder-row open' : 'folder-row';
      const listClass = isOpen ? 'notes-tree-list expanded' : 'notes-tree-list';

      let childrenHtml = '';
      
      folder.files.forEach((file, i) => {
        childrenHtml += `
          <div class="note-row" data-fileid="${file.id}" style="${childMargin}">
            <div class="note-name-col" onclick="openFile('${file.id}')">
              <svg class="note-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M4 1.75C4 .784 4.784 0 5.75 0h4.5c.966 0 1.75.784 1.75 1.75v12.5A1.75 1.75 0 0 1 10.25 16h-4.5A1.75 1.75 0 0 1 4 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h4.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25Z"/>
              </svg>
              <span class="note-title-text">${file.title || 'Untitled Note'}</span>
            </div>
            <div>
              <button class="action-btn" onclick="event.stopPropagation(); deleteNote('${pathStr}', ${i})" title="Delete note">✕</button>
            </div>
          </div>
        `;
      });

      folder.folders.forEach((subFolder, i) => {
        childrenHtml += generateFolderHTML(subFolder, [...pathArr, i], level + 1);
      });

      if (folder.folders.length === 0 && folder.files.length === 0) {
        childrenHtml += `<div class="note-row empty-folder-msg" style="${childMargin} color: rgba(255,255,255,0.3); font-style: italic;">No items here.</div>`;
      }

      return `
        <div class="folder-group" style="${groupMargin}">
          <div class="${rowClass}" id="folder-row-${pathStr}" data-path="${pathStr}" onclick="toggleFolder('${pathStr}')">
            <div class="folder-title-col">
              <svg class="folder-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/>
              </svg>
              <span>📁 ${folder.name}</span>
              <span class="note-count-tag">${folder.folders.length + folder.files.length} items</span>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;" onclick="event.stopPropagation();">
              <button class="btn action-node" data-actionindex="1" style="padding: 4px 8px; font-size: 0.7rem;" onclick="addNoteToFolder('${pathStr}')">+ Note</button>
              <button class="btn action-node" data-actionindex="2" style="padding: 4px 8px; font-size: 0.7rem;" onclick="addFolderToFolder('${pathStr}')">+ Folder</button>
              <button class="action-btn action-node" data-actionindex="3" style="padding: 4px 8px; font-size: 0.7rem;" onclick="deleteFolder('${pathStr}')">Delete</button>
            </div>
          </div>
          <div class="${listClass}" id="notes-tree-${pathStr}">
            ${childrenHtml}
          </div>
        </div>
      `;
    }

    function renderFolders() {
      projects = initProjects(JSON.parse(localStorage.getItem('snapnote_projects')) || []);
      
      foldersContainer.innerHTML = '';
      totalFoldersBadge.textContent = `${projects.length} Folders`;

      if (projects.length === 0) {
        foldersContainer.innerHTML = `
          <div class="empty-state-msg">
            No folders created yet. Click "+ New Folder" to start.
          </div>`;
        buildNavigation();
        return;
      }

      let completeHtml = '';
      projects.forEach((proj, idx) => {
        completeHtml += generateFolderHTML(proj, [idx], 0);
      });
      foldersContainer.innerHTML = completeHtml;
      
      buildNavigation();
    }

    function getFolderByPath(pathStr) {
      const indices = pathStr.split('-').map(Number);
      let current = projects[indices[0]];
      for (let i = 1; i < indices.length; i++) {
        current = current.folders[indices[i]];
      }
      return current;
    }

    function getParentByPath(pathStr) {
      const indices = pathStr.split('-').map(Number);
      if (indices.length === 1) return { arr: projects, index: indices[0] };
      
      let current = projects[indices[0]];
      for (let i = 1; i < indices.length - 1; i++) {
        current = current.folders[indices[i]];
      }
      return { arr: current.folders, index: indices[indices.length - 1] };
    }

    window.toggleFolder = function(pathStr) {
      const folderRow = document.getElementById(`folder-row-${pathStr}`);
      const notesList = document.getElementById(`notes-tree-${pathStr}`);
      
      folderRow.classList.toggle('open');
      notesList.classList.toggle('expanded');
      
      if (folderRow.classList.contains('open')) {
        openFolderPaths.add(pathStr);
      } else {
        openFolderPaths.delete(pathStr);
      }
      
      buildNavigation();
    };

    // Replaced standard 'prompt' with custom await modal
    document.getElementById('new-folder-btn').addEventListener('click', async () => {
      const name = await openCustomPrompt("Create Main Folder", "Folder name...");
      if (name && name.trim()) {
        projects.push({ name: name.trim(), files: [], folders: [] });
        saveProjects();
        renderFolders();
      }
    });

    window.addFolderToFolder = async function(pathStr) {
      const name = await openCustomPrompt("Create Subfolder", "Folder name...");
      if (name && name.trim()) {
        const folder = getFolderByPath(pathStr);
        folder.folders.push({ name: name.trim(), files: [], folders: [] });
        saveProjects();
        openFolderPaths.add(pathStr);
        renderFolders();
      }
    };

    window.addNoteToFolder = async function(pathStr) {
      const name = await openCustomPrompt("Create New Note", "Note title...");
      if (name && name.trim()) {
        const newFile = { id: 'file_' + Date.now(), title: name.trim(), content: '' };
        const folder = getFolderByPath(pathStr);
        folder.files.push(newFile);
        saveProjects();
        openFolderPaths.add(pathStr);
        renderFolders();
      }
    };

    // Replaced standard 'confirm' with custom await modal
    window.deleteFolder = async function(pathStr) {
      const parentInfo = getParentByPath(pathStr);
      const folderToDelete = parentInfo.arr[parentInfo.index];
      const confirmed = await openCustomConfirm("Delete Folder", `Are you sure you want to delete "${folderToDelete.name}" and all its contents?`);
      if (confirmed) {
        parentInfo.arr.splice(parentInfo.index, 1);
        saveProjects();
        renderFolders();
      }
    };

    window.deleteNote = async function(pathStr, fIdx) {
      const confirmed = await openCustomConfirm("Delete Note", "Are you sure you want to delete this note?");
      if (confirmed) {
        const folder = getFolderByPath(pathStr);
        const targetFile = folder.files[fIdx];
        
        let savedTabs = JSON.parse(localStorage.getItem('snapnote_tabs')) || [];
        savedTabs = savedTabs.filter(t => t.fileId !== targetFile.id);
        localStorage.setItem('snapnote_tabs', JSON.stringify(savedTabs));

        folder.files.splice(fIdx, 1);
        saveProjects();
        renderFolders();
      }
    };

    window.openFile = function(fileId) {
      localStorage.setItem('snapnote_open_file_id', fileId);
      window.location.href = 'index.html';
    };

    function walkDOMForNav(container) {
      const children = Array.from(container.children);
      for (let child of children) {
         if (child.classList.contains('folder-group')) {
            const row = child.querySelector(':scope > .folder-row');
            if (row) {
                navItems.push({ type: 'folder', path: row.dataset.path, el: row });
                const list = child.querySelector(':scope > .notes-tree-list');
                if (list && list.classList.contains('expanded')) {
                   walkDOMForNav(list);
                }
            }
         } else if (child.classList.contains('note-row')) {
            if (!child.classList.contains('empty-folder-msg')) {
                navItems.push({ type: 'note', fileId: child.dataset.fileid, el: child });
            }
         }
      }
    }

    function buildNavigation() {
      navItems = [];
      focusedActionIndex = 0;
      
      const newFolderBtn = document.getElementById('new-folder-btn');
      navItems.push({ type: 'button', el: newFolderBtn });

      walkDOMForNav(foldersContainer);
      updateFocusUI();
    }

    function updateFocusUI() {
      document.querySelectorAll('.focused-item').forEach(el => el.classList.remove('focused-item'));
      
      if (navItems.length > 0) {
        if (focusedIndex < 0) focusedIndex = 0;
        if (focusedIndex >= navItems.length) focusedIndex = navItems.length - 1;
        
        const item = navItems[focusedIndex];
        
        if (item.type === 'folder' && focusedActionIndex > 0) {
          const actionBtn = item.el.querySelector(`.action-node[data-actionindex="${focusedActionIndex}"]`);
          if (actionBtn) {
            actionBtn.classList.add('focused-item');
            actionBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        } else {
          item.el.classList.add('focused-item');
          item.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      // Daca o fereastra modala custom e deschisa, oprim scurtaturile globale
      if (document.getElementById('custom-prompt-overlay').classList.contains('active') ||
          document.getElementById('custom-confirm-overlay').classList.contains('active')) {
        return;
      }

      // Comutare rapidă Alt + W înapoi în Editor
      if (e.altKey && (e.code === 'KeyW' || e.key.toLowerCase() === 'w' || e.key === '∑')) {
        e.preventDefault();
        window.location.href = 'index.html';
        return;
      }
      
      if (document.activeElement.tagName === 'INPUT') return;
      if (navItems.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusedIndex++;
        focusedActionIndex = 0;
        updateFocusUI();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        focusedIndex--;
        focusedActionIndex = 0; 
        updateFocusUI();
      } else if (e.key === 'ArrowRight') {
        const item = navItems[focusedIndex];
        if (item.type === 'folder') {
          e.preventDefault();
          if (focusedActionIndex < 3) {
            focusedActionIndex++;
            updateFocusUI();
          }
        }
      } else if (e.key === 'ArrowLeft') {
        const item = navItems[focusedIndex];
        if (item.type === 'folder') {
          e.preventDefault();
          if (focusedActionIndex > 0) {
            focusedActionIndex--;
            updateFocusUI();
          }
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const item = navItems[focusedIndex];
        
        if (item.type === 'button') {
          item.el.click();
        } else if (item.type === 'folder') {
          if (focusedActionIndex > 0) {
            const actionBtn = item.el.querySelector(`.action-node[data-actionindex="${focusedActionIndex}"]`);
            if (actionBtn) actionBtn.click();
          } else {
            toggleFolder(item.path);
          }
        } else if (item.type === 'note') {
          openFile(item.fileId);
        }
      }
    });

    renderFolders();
  </script>
</body>
</html>
